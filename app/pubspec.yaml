name: dropdrawer_app
description: "DropDrawer - Cross-platform P2P & multi-cloud file transfer drawer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^9.0.2
  super_drag_and_drop: ^0.9.1
  ffi: ^2.1.3
  mime: ^2.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
