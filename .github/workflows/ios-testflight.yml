name: iOS TestFlight

# Archives the native iOS app (apple/) and uploads it to App Store Connect, from
# where it can be released to TestFlight testers. Run it by hand for a release tag.
#
# Repository secrets (App Store Connect → Users and Access → Integrations → Keys,
# role "App Manager"):
#   APP_STORE_CONNECT_API_KEY_ID        the key ID
#   APP_STORE_CONNECT_ISSUER_ID         the issuer ID shown above the key list
#   APP_STORE_CONNECT_API_KEY_P8_BASE64 the downloaded AuthKey_<id>.p8, base64-encoded
#   APPLE_TEAM_ID                       the Apple Developer team ID
#
# The App IDs com.dropdrawer.ios and com.dropdrawer.ios.ShareExtension need the
# App Groups capability (group.com.dropdrawer.shared) and, for the app, Push
# Notifications. Xcode creates the signing certificates and profiles with the key.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching app/pubspec.yaml, e.g. v0.1.10"
        required: true
        type: string

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Require App Store Connect credentials
        if: env.HAS_ASC_KEY != 'true'
        run: |
          echo "::error::Set APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8_BASE64 and APPLE_TEAM_ID first."
          exit 1

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/check_release_tag.sh "$RELEASE_TAG"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Apple P2P XCFramework (device + Simulator)
        run: ./scripts/build_apple_p2p.sh

      - name: Generate the Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd apple && xcodegen generate)

      - name: Write the App Store Connect key
        env:
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          umask 077
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$key"
          printf 'ASC_KEY_PATH=%s\n' "$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project apple/DropDrawer.xcodeproj \
            -scheme DropDrawerIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DropDrawer.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/DropDrawer.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
