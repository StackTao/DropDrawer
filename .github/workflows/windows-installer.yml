name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to embed in the app"
        type: string
        required: false
      previous_run:
        description: "Optional Windows installer run to upgrade from in the smoke test"
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      FLUTTER_VERSION: "3.44.0"
      FLUTTER_SHA256: 88da00194893bf9543fc47c0bf31e6de978d49ffdb9c2f6e30c46dde0116c768
      FLUTTER_RELEASE_DIR: app/build/windows/x64/runner/Release
      INSTALLER_PATH: dist/DropDrawer-Windows-x64-Setup.exe

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $archive = Join-Path $env:RUNNER_TEMP 'flutter-windows.zip'
          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$($env:FLUTTER_VERSION)-stable.zip"
          curl.exe --fail --location --retry 3 --silent --show-error --output $archive $url
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:FLUTTER_SHA256) {
            throw 'Flutter archive checksum does not match.'
          }
          tar.exe -xf $archive -C $env:RUNNER_TEMP
          Remove-Item $archive
          Join-Path $env:RUNNER_TEMP 'flutter\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build Flutter app
        working-directory: app
        env:
          DROPDRAWER_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PUB_CACHE = Join-Path $env:RUNNER_TEMP 'pub-cache'
          flutter pub get --enforce-lockfile
          flutter test --no-pub
          flutter build windows --release --no-pub "--dart-define=DROPDRAWER_RELEASE_TAG=$env:DROPDRAWER_RELEASE_TAG"

      - name: Build native P2P library
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --no-self-update
          cargo +stable-x86_64-pc-windows-msvc build --locked --release -p p2p-core --target x86_64-pc-windows-msvc
          Copy-Item 'target/x86_64-pc-windows-msvc/release/dropdrawer_p2p.dll' $env:FLUTTER_RELEASE_DIR

      - name: Test native Windows P2P transfer
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo +stable-x86_64-pc-windows-msvc test --locked --release -p p2p-core --target x86_64-pc-windows-msvc

      - name: Package with Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem (Join-Path $vs 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT') -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending |
            Select-Object -First 1
          if (!$crt) { throw 'Visual C++ x64 redistributable files were not found.' }
          Copy-Item (Join-Path $crt.FullName '*.dll') $env:FLUTTER_RELEASE_DIR

          $version = (Select-String '^version:\s*([^+\s]+)' app/pubspec.yaml).Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$version" 'deploy/windows/DropDrawer.iss'

      - name: Download previous installer for upgrade test
        if: inputs.previous_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_run }}
        run: gh run download $env:PREVIOUS_RUN -n DropDrawer-Windows-x64 -D previous-installer

      - name: Verify running upgrade, native DLL, and running uninstall
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'DropDrawer Test'
          $appExe = Join-Path $installDir 'dropdrawer_app.exe'
          $silent = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          function InstallDrawer($setup) {
            $p = Start-Process $setup -Wait -PassThru -ArgumentList ($silent + ('/DIR="' + $installDir + '"'))
            if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)" }
          }
          function HideToTray($p) {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $p.Refresh()
            } until ($p.HasExited -or $p.MainWindowHandle -ne 0 -or (Get-Date) -ge $deadline)
            if ($p.HasExited -or !$p.CloseMainWindow()) { throw 'Could not hide DropDrawer to tray' }
            Start-Sleep -Milliseconds 500
            $p.Refresh()
            if ($p.HasExited -or $p.MainWindowHandle -ne 0) { throw 'Could not confirm tray residency' }
          }

          $previous = 'previous-installer/DropDrawer-Windows-x64-Setup.exe'
          if (Test-Path $previous) { InstallDrawer $previous } else { InstallDrawer $env:INSTALLER_PATH }
          $app = Start-Process $appExe -WorkingDirectory $installDir -PassThru
          try {
            HideToTray $app
            InstallDrawer $env:INSTALLER_PATH
            if (!$app.WaitForExit(5000)) { throw 'Upgrade left the old tray process running' }
            $dll = [System.Runtime.InteropServices.NativeLibrary]::Load((Join-Path $installDir 'dropdrawer_p2p.dll'))
            try {
              [void][System.Runtime.InteropServices.NativeLibrary]::GetExport($dll, 'dropdrawer_p2p_cancel_transfer')
            } finally {
              [System.Runtime.InteropServices.NativeLibrary]::Free($dll)
            }
            $app = Start-Process $appExe -WorkingDirectory $installDir -PassThru
            HideToTray $app
            $second = Start-Process $appExe -WorkingDirectory $installDir -PassThru
            if (!$second.WaitForExit(10000) -or $second.ExitCode -ne 0 -or $app.HasExited) {
              throw 'Single-instance activation failed'
            }
            HideToTray $app
            $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
            $registryPath = 'HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run'
            Set-ItemProperty $runKey -Name DropDrawer -Value ('"' + $appExe + '" --background')
            $uninstall = Start-Process (Join-Path $installDir 'unins000.exe') -Wait -PassThru -ArgumentList $silent
            if ($uninstall.ExitCode -ne 0 -or !$app.WaitForExit(5000) -or (Test-Path $appExe) -or
                ($null -ne [Microsoft.Win32.Registry]::GetValue($registryPath, 'DropDrawer', $null))) {
              throw 'Running uninstall failed to remove the app, process or startup entry'
            }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DropDrawer-Windows-x64
          path: dist/DropDrawer-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 30
