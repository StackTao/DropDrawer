name: Docker Server Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag (e.g. v0.1.8 or edge)"
        required: false
        type: string
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "deploy/Dockerfile"
      - ".github/workflows/docker-server.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"amd64","runner":"ubuntu-latest"}]' || '[{"platform":"amd64","runner":"ubuntu-latest"},{"platform":"arm64","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/check_release_tag.sh "$RELEASE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve registry image name
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: printf 'IMAGE=ghcr.io/%s/dropdrawer-server\n' "${IMAGE_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build platform image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.platform }}

      - name: Record image digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > digests/${{ matrix.platform }}.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: image-digest-${{ matrix.platform }}
          path: digests/${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-digest-*
          path: digests
          merge-multiple: true

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dropdrawer-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Publish multi-platform image
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="ghcr.io/${IMAGE_OWNER,,}/dropdrawer-server"
          tags=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] && tags+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "$image@$(cat digests/amd64.txt)" "$image@$(cat digests/arm64.txt)"
