name: Android APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to embed in the app (requires distribution signing)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      FLUTTER_VERSION: "3.44.0"

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android Rust targets & cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build native Android P2P libraries (.so)
        run: |
          NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "Using NDK: $NDK_HOME"
          export ANDROID_NDK_HOME="$NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/android/app/src/main/jniLibs \
            build --locked --release -p p2p-core
          ls -lh app/android/app/src/main/jniLibs/arm64-v8a/libdropdrawer_p2p.so
          ls -lh app/android/app/src/main/jniLibs/armeabi-v7a/libdropdrawer_p2p.so
          nm -D app/android/app/src/main/jniLibs/arm64-v8a/libdropdrawer_p2p.so | grep -q dropdrawer_p2p_start
          nm -D app/android/app/src/main/jniLibs/arm64-v8a/libdropdrawer_p2p.so | grep -q dropdrawer_p2p_cancel_transfer

          for abi in arm64-v8a armeabi-v7a; do
            symbols="$(nm -D "app/android/app/src/main/jniLibs/$abi/libdropdrawer_p2p.so")"
            for method in initializeP2pDns notifyP2pNetworkChange; do
              grep -q "Java_com_dropdrawer_dropdrawer_1app_DropDrawerApplication_${method}$" <<< "$symbols"
            done
          done

      - name: Check release tag
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: scripts/check_release_tag.sh "$RELEASE_TAG"

      - name: Prepare distribution signing
        if: inputs.release_tag != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.DROPDRAWER_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure the Android release keystore before building a tagged APK."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/dropdrawer-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          printf 'DROPDRAWER_ANDROID_KEYSTORE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Analyze, test, and build Android Release APK
        working-directory: app
        env:
          DROPDRAWER_RELEASE_TAG: ${{ inputs.release_tag }}
          DROPDRAWER_ANDROID_STORE_PASSWORD: ${{ inputs.release_tag != '' && secrets.DROPDRAWER_ANDROID_STORE_PASSWORD || '' }}
          DROPDRAWER_ANDROID_KEY_ALIAS: ${{ inputs.release_tag != '' && secrets.DROPDRAWER_ANDROID_KEY_ALIAS || '' }}
          DROPDRAWER_ANDROID_KEY_PASSWORD: ${{ inputs.release_tag != '' && secrets.DROPDRAWER_ANDROID_KEY_PASSWORD || '' }}
        run: |
          flutter pub get --enforce-lockfile

          # Patch pub-cache plugins for Gradle 9 (Project.exec -> ExecOperations),
          # AGP 9 AAR metadata check (compileSdk >= 35), and super_native_extensions LTO+panic=abort
          # on modern Rust without affecting no_std crates.
          python3 - <<'PY'
          import glob, os, re
          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          for path in glob.glob(os.path.join(pub_cache, "hosted", "pub.dev", "*", "cargokit", "gradle", "plugin.gradle")):
              with open(path, "r", encoding="utf-8") as f:
                  src = f.read()
              if "project.exec {" not in src:
                  continue
              if "getExecOperations()" not in src:
                  src = src.replace(
                      "abstract class CargoKitBuildTask extends DefaultTask {",
                      "abstract class CargoKitBuildTask extends DefaultTask {\n\n    @javax.inject.Inject\n    abstract org.gradle.process.ExecOperations getExecOperations()",
                      1,
                  )
              src = src.replace("project.exec {", "execOperations.exec {")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)
              print("Patched cargokit for Gradle 9:", path)

          for path in glob.glob(os.path.join(pub_cache, "hosted", "pub.dev", "super_native_extensions-*", "rust", "Cargo.toml")):
              with open(path, "r", encoding="utf-8") as f:
                  src = f.read()
              patched = src.replace("lto = true", "lto = false").replace('panic = "abort"', 'panic = "unwind"')
              if patched != src:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(patched)
                  print("Patched super_native_extensions Cargo.toml:", path)

          for path in glob.glob(os.path.join(pub_cache, "hosted", "pub.dev", "*", "android", "build.gradle")):
              with open(path, "r", encoding="utf-8") as f:
                  src = f.read()
              patched = re.sub(r"\bcompileSdk(?:Version)?\s*=?\s*([12]\d|3[0-4])\b", "compileSdk 36", src)
              if patched != src:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(patched)
                  print("Bumped compileSdk to 36:", path)
          PY

          flutter analyze --no-pub
          flutter test --no-pub
          release_define="--dart-define=DROPDRAWER_RELEASE_TAG=$DROPDRAWER_RELEASE_TAG"
          flutter build apk --release --no-pub "$release_define" --target-platform android-arm64,android-arm --split-per-abi
          flutter build apk --release --no-pub "$release_define" --target-platform android-arm64,android-arm
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../dist/DropDrawer-Android-arm64.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/DropDrawer-Android-universal.apk
          ls -lh ../dist/*.apk

      - name: Remove distribution signing file
        if: always() && inputs.release_tag != ''
        run: rm -f "$RUNNER_TEMP/dropdrawer-release.keystore"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DropDrawer-Android-APK
          path: |
            dist/DropDrawer-Android-arm64.apk
            dist/DropDrawer-Android-universal.apk
          if-no-files-found: error
          retention-days: 30
