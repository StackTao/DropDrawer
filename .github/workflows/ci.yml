name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: "3.44.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze and test Flutter app
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub

  apple-ios:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build Apple P2P XCFramework (Simulator + macOS host)
        run: ./scripts/build_apple_p2p.sh --sim-only

      - name: Run DropDrawerCore Swift tests
        working-directory: apple/DropDrawerCore
        run: swift test

      - name: Install XcodeGen and build DropDrawerIOS Simulator target
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          (cd apple && xcodegen generate)
          xcodebuild \
            -project apple/DropDrawer.xcodeproj \
            -scheme DropDrawerIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath apple/build-ci \
            CODE_SIGNING_ALLOWED=NO \
            build
