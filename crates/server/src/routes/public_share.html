<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>__TITLE__</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at top, #1f2430 0%, #0e1015 70%);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: #f5f5f7; padding: 20px;
  }
  .card {
    width: 100%; max-width: 480px; background: rgba(28, 28, 32, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 18px;
    padding: 26px 24px; backdrop-filter: blur(24px);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .logo { width: 30px; height: 30px; display: block; }
  .brand span { font-size: 14px; font-weight: 600; color: rgba(245,245,247,0.9); }
  .name { font-size: 17px; font-weight: 600; word-break: break-all; margin: 0 0 6px; }
  .meta { font-size: 12.5px; color: rgba(235,235,245,0.55); margin-bottom: 18px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
  input {
    flex: 1; background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 14px; outline: none;
  }
  input:focus { border-color: #0a84ff; }
  button, a.btn {
    display: inline-flex; align-items: center; justify-content: center; width: 100%;
    height: 40px; border-radius: 10px; border: none; cursor: pointer;
    font-size: 13.5px; font-weight: 600; text-decoration: none;
    background: #f5f5f7; color: #111113; transition: opacity .15s;
  }
  button.secondary, button.mini-btn {
    background: rgba(255,255,255,0.1); color: #f5f5f7; width: auto; padding: 0 12px;
    height: 30px; font-size: 12px; border-radius: 8px; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; border: none; cursor: pointer;
    flex-shrink: 0;
  }
  button:hover, a.btn:hover, button.mini-btn:hover { opacity: 0.88; }
  button:disabled { opacity: .55; cursor: wait; }
  .download-status { color: rgba(235,235,245,.75); font-size: 12px; margin-top: 6px; }
  .download-status:empty { display: none; }
  pre.text-box {
    background: rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px; padding: 12px; white-space: pre-wrap; word-break: break-word;
    max-height: 240px; overflow: auto; font-size: 13px; margin: 0 0 14px;
  }
  .bundle-list {
    display: flex; flex-direction: column; gap: 8px;
    max-height: 320px; overflow-y: auto; margin-bottom: 16px;
  }
  .bundle-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 11px;
  }
  .bundle-info { flex: 1; min-width: 0; }
  .bundle-title {
    font-size: 13px; font-weight: 500; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .bundle-sub { font-size: 11.5px; color: rgba(235,235,245,0.5); margin-top: 2px; }
  .err { color: #ff453a; font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img class="logo" src="/admin/assets/logo.svg" alt="" /><span>__BRAND__</span></div>
  <div id="app">__LOADING__</div>
</div>
<script src="/api/share-peer.js"></script>
<script>
const code = "__SHARE_CODE__";
const EN = document.documentElement.lang === "en";
const shareApi = "/api/s/" + encodeURIComponent(code);
const LOCALE = EN ? "en" : "zh-CN";
const T = EN ? {
  cantOpen: "Can't open this share",
  count: n => `${n} items · `,
  downloads: (n, max) => max ? ` · ${n}/${max} downloads` : ` · ${n} download${n === 1 ? "" : "s"}`,
  expires: t => ` · Expires ${t}`,
  passcodePlaceholder: "Enter the passcode",
  unlock: "Open",
  textSnippet: "Text",
  file: "File",
  copyText: "Copy text",
  download: "Download",
  downloadAll: n => `Download all (${n} file${n === 1 ? "" : "s"})`,
  copyAllText: "Copy all text",
  downloadFile: "Download file",
  wrongPasscode: "Incorrect passcode. Try again",
  copiedToClipboard: "Copied to clipboard",
  copied: "Copied",
  connecting: "Connecting to the sender…",
  transferring: n => `LAN transfer · ${n}%`,
  saved: "Sent to your browser’s downloads",
  cloud: "Downloading from the cloud copy",
  waiting: "Waiting for the sender. Ask them to keep DropDrawer open and join the same local network, then retry.",
} : {
  cantOpen: "无法访问该分享",
  count: n => `共 ${n} 项 · `,
  downloads: (n, max) => max ? ` · 已下载 ${n}/${max} 次` : ` · 已下载 ${n} 次`,
  expires: t => ` · 有效期至 ${t}`,
  passcodePlaceholder: "请输入提取码",
  unlock: "提取",
  textSnippet: "文本片段",
  file: "文件",
  copyText: "复制文本",
  download: "下载",
  downloadAll: n => `全部下载 (${n} 个文件)`,
  copyAllText: "复制全部文本",
  downloadFile: "立即下载文件",
  wrongPasscode: "提取码不正确，请重试",
  copiedToClipboard: "已复制到剪贴板",
  copied: "已复制",
  connecting: "正在连接发送端…",
  transferring: n => `局域网直传 · ${n}%`,
  saved: "已交给浏览器保存",
  cloud: "正在从云端副本下载",
  waiting: "等待发送端。请让发送方保持 DropDrawer 在线，双方连接到同一局域网后重试。",
};
let currentPasscode = new URLSearchParams(location.search).get("p") || "";

function fmtBytes(b) {
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  if (b < 1073741824) return (b / 1048576).toFixed(1) + " MB";
  return (b / 1073741824).toFixed(2) + " GB";
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function buildDlUrl(itemId, session) {
  const params = new URLSearchParams();
  if (itemId) params.set("item_id", itemId);
  if (currentPasscode) params.set("passcode", currentPasscode);
  if (session) params.set("peer_session", session);
  return shareApi + "/download?" + params.toString();
}

async function load(errMsg, preloaded) {
  const el = document.getElementById("app");
  // Opening a text share with a download limit counts as a download, so the
  // response of a successful unlock is rendered as is instead of fetched again.
  let d = preloaded;
  if (!d) {
    const q = currentPasscode ? ("?passcode=" + encodeURIComponent(currentPasscode)) : "";
    const resp = await fetch("/api/s/" + encodeURIComponent(code) + "/meta" + q);
    if (!resp.ok) {
      const t = await resp.text();
      el.innerHTML = `<p class="name">${T.cantOpen}</p><p class="err">${esc(t || resp.statusText)}</p>`;
      return;
    }
    d = await resp.json();
  }
  const items = Array.isArray(d.items) ? d.items : [];
  const countInfo = d.item_count > 1 ? T.count(d.item_count) : "";
  const limitInfo = T.downloads(d.download_count, d.max_downloads);
  const expInfo = d.expires_at ? T.expires(new Date(d.expires_at).toLocaleString(LOCALE, { dateStyle: "medium", timeStyle: "short" })) : "";

  if (d.locked) {
    el.innerHTML = `
      <p class="name">${esc(d.name)}</p>
      <p class="meta">${countInfo}${fmtBytes(d.size)}${limitInfo}${expInfo}</p>
      <div class="input-row">
        <input id="pw" placeholder="${T.passcodePlaceholder}" value="${esc(currentPasscode)}" />
        <button class="secondary" style="height:40px;padding:0 16px;" onclick="unlock()">${T.unlock}</button>
      </div>
      ${errMsg ? `<div class="err">${esc(errMsg)}</div>` : ""}
    `;
    document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
    return;
  }

  window._bundleItems = items;
  if (items.length > 1) {
    const fileItems = items.filter(it => it.kind === "file");
    const rowsHtml = items.map((it, idx) => {
      if (it.kind === "text") {
        return `
          <div class="bundle-row">
            <div class="bundle-info">
              <div class="bundle-title">${esc(it.name)}</div>
              <div class="bundle-sub">${T.textSnippet} · ${fmtBytes(it.size)}</div>
            </div>
            <button class="mini-btn" onclick="copyBundleText(${idx}, this)">${T.copyText}</button>
          </div>
        `;
      }
      return `
        <div class="bundle-row">
          <div class="bundle-info">
            <div class="bundle-title">${esc(it.name)}</div>
            <div class="bundle-sub">${T.file} · ${fmtBytes(it.size)}</div>
            <div class="download-status" id="status-${idx}" role="status"></div>
          </div>
          <button class="mini-btn" id="download-${idx}" onclick="downloadFile(${idx})">${T.download}</button>
        </div>
      `;
    }).join("");

    el.innerHTML = `
      <p class="name">${esc(d.name)}</p>
      <p class="meta">${countInfo}${fmtBytes(d.size)}${limitInfo}${expInfo}</p>
      <div class="bundle-list">${rowsHtml}</div>
      ${fileItems.length > 0 ? `<button onclick="downloadAllFiles(this)">${T.downloadAll(fileItems.length)}</button>` : ""}
    `;
    return;
  }

  if (d.kind === "text") {
    el.innerHTML = `
      <p class="name">${esc(d.name)}</p>
      <p class="meta">${T.textSnippet} · ${fmtBytes(d.size)}${expInfo}</p>
      <pre class="text-box" id="txt">${esc(d.text_content || "")}</pre>
      <button onclick="copyTxt(this)">${T.copyAllText}</button>
    `;
    window._sharedText = d.text_content || "";
    return;
  }

  el.innerHTML = `
    <p class="name">${esc(d.name)}</p>
    <p class="meta">${fmtBytes(d.size)}${limitInfo}${expInfo}</p>
    <button id="download-0" onclick="downloadFile(0)">${T.downloadFile}</button>
    <div class="download-status" id="status-0" role="status"></div>
  `;
}

async function unlock() {
  const typed = document.getElementById("pw").value.trim();
  if (!typed) return;
  const q = "?passcode=" + encodeURIComponent(typed);
  const resp = await fetch("/api/s/" + encodeURIComponent(code) + "/meta" + q);
  // Failed attempts are rate limited, so never resend a rejected passcode.
  if (!resp.ok) {
    currentPasscode = "";
    load((await resp.text()) || resp.statusText);
    return;
  }
  const d = await resp.json();
  if (d.locked) {
    currentPasscode = "";
    load(T.wrongPasscode);
  } else {
    currentPasscode = typed;
    load(undefined, d);
  }
}

function copyTxt(btn) {
  navigator.clipboard.writeText(window._sharedText || "");
  if (btn) btn.textContent = T.copiedToClipboard;
}

function copyBundleText(idx, btn) {
  const it = (window._bundleItems || [])[idx];
  if (!it) return;
  navigator.clipboard.writeText(it.text_content || it.name || "");
  if (btn) btn.textContent = T.copied;
}

async function downloadFile(idx) {
  const item = window._bundleItems[idx];
  const button = document.getElementById("download-" + idx);
  const status = document.getElementById("status-" + idx);
  if (!item || button.disabled) return;
  button.disabled = true;
  status.textContent = T.connecting;
  const attempt = {};
  try {
    await window.receiveLanShare(shareApi, item, currentPasscode,
      percent => { status.textContent = T.transferring(percent); }, attempt);
    status.textContent = T.saved;
  } catch (error) {
    if (error.accessDenied) {
      status.textContent = error.message || T.cantOpen;
    } else if (item.cloud_ready) {
      status.textContent = T.cloud;
      const link = document.createElement("a");
      link.href = buildDlUrl(item.id, attempt.session);
      link.download = item.name;
      document.body.append(link);
      link.click();
      link.remove();
    } else {
      status.textContent = T.waiting;
    }
  } finally {
    button.disabled = false;
  }
}

async function downloadAllFiles(button) {
  button.disabled = true;
  try {
    for (const [idx, item] of window._bundleItems.entries()) {
      if (item.kind === "file") await downloadFile(idx);
    }
  } finally {
    button.disabled = false;
  }
}

load();
</script>
</body>
</html>
