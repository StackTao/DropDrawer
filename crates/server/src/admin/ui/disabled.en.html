<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>DropDrawer Admin is disabled</title>
<link rel="icon" href="/admin/assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/admin/assets/admin.css" />
</head>
<body>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo-wrap">
        <img class="auth-logo" src="/admin/assets/logo.svg" alt="DropDrawer" />
      </div>
      <h1>The admin console is disabled</h1>
      <p class="lead">For security, DropDrawer turns off <code>/admin</code> by default.</p>
    </div>
    <p class="auth-foot">Set <code>DROPDRAWER_ADMIN_ENABLED=true</code> in the server environment and restart the server to enable it.</p>
  </div>
</div>
</body>
</html>
