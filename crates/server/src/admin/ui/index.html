<div id="loginView" class="auth-screen" hidden>
  <div class="auth-card">
    <img class="auth-logo" src="/admin/assets/logo.svg" alt="" />
    <h1>DropDrawer Admin</h1>
    <p class="lead">登录服务器管理控制台</p>
    <div class="segmented auth-tabs" role="tablist">
      <button type="button" class="active" id="modeAccount" role="tab" aria-selected="true">管理员账号</button>
      <button type="button" id="modeToken" role="tab" aria-selected="false">管理员密钥</button>
    </div>
    <form id="loginForm" autocomplete="on">
      <div id="accountFields" class="auth-fields">
        <input id="loginUser" class="input" type="text" placeholder="用户名" autocomplete="username" aria-label="用户名" />
        <input id="loginPassword" class="input" type="password" placeholder="密码" autocomplete="current-password" aria-label="密码" />
      </div>
      <div id="totpFields" class="auth-fields" hidden>
        <p class="auth-hint">已开启两步验证，请输入身份验证器中的 6 位验证码</p>
        <input id="loginTotp" class="input mono totp-input" type="text" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="000000" autocomplete="one-time-code" aria-label="两步验证码" />
      </div>
      <div id="tokenFields" class="auth-fields" hidden>
        <input id="loginToken" class="input" type="password" placeholder="DROPDRAWER_ADMIN_TOKEN" autocomplete="off" aria-label="管理员密钥" />
      </div>
      <div id="loginError" class="auth-error" role="alert"></div>
      <button id="loginSubmit" class="btn primary block" type="submit">登录</button>
    </form>
    <p class="foot" id="loginFoot">管理员账号由超级管理员在控制台中创建。首次使用请切换到「管理员密钥」，用服务端环境变量 <code>DROPDRAWER_ADMIN_TOKEN</code> 登录。连续输错会被临时锁定。</p>
  </div>
</div>

<div id="appView" class="shell" hidden>
  <aside class="sidebar">
    <div class="brand">
      <img src="/admin/assets/logo.svg" alt="" />
      <div class="brand-name">DropDrawer<span class="brand-tag">Admin</span></div>
    </div>
    <nav class="nav" id="nav" aria-label="管理导航"></nav>
    <div class="sidebar-foot">
      <div class="server-chip" id="serverChip"><span class="dot ok"></span><span>服务运行中</span></div>
      <a class="nav-item me-item" id="meLink" href="#/me"><span class="avatar xs" id="meAvatar">A</span><span class="me-text"><span id="meName">管理员</span><span class="me-role" id="meRole"></span></span></a>
      <button class="nav-item" id="logoutBtn" type="button"><svg class="icon"><use href="#i-logout"/></svg><span>退出登录</span></button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle"></h1>
        <p id="pageDesc"></p>
      </div>
      <div class="topbar-actions" id="pageActions"></div>
    </header>
    <div id="pageRoot"></div>
  </main>
</div>

<div id="savebar" class="savebar" role="status" aria-live="polite">
  <span class="dot"></span>
  <span>有未保存的更改</span>
  <button class="btn ghost sm" id="discardBtn" type="button">放弃</button>
  <button class="btn primary sm" id="saveBtn" type="button">保存更改</button>
</div>
<div id="overlayRoot"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
