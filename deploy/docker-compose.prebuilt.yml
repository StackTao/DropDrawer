# DropDrawer prebuilt multi-arch Docker Compose (zero local compilation).
# Usage:
#   docker compose -f deploy/docker-compose.prebuilt.yml up -d
#
# To create your first administrator account (when DROPDRAWER_ADMIN_ENABLED=true):
#   docker compose -f deploy/docker-compose.prebuilt.yml exec -T dropdrawer-server \
#     dropdrawer-server admin-account yourname <<< 'YourStrongPassword123!'

services:
  dropdrawer-server:
    image: ghcr.io/stacktao/dropdrawer-server:${DROPDRAWER_IMAGE_TAG:-latest}
    container_name: dropdrawer-server
    restart: unless-stopped
    ports:
      - "${DROPDRAWER_PORT:-8080}:8080"
    environment:
      - DROPDRAWER_BIND=0.0.0.0:8080
      - DROPDRAWER_DB_PATH=/data/dropdrawer.db
      - DROPDRAWER_LOCAL_STORAGE=/data/blobs
      - DROPDRAWER_LOCAL_MAX_FILE_BYTES=${DROPDRAWER_LOCAL_MAX_FILE_BYTES:-}
      - DROPDRAWER_LOCAL_USER_QUOTA_BYTES=${DROPDRAWER_LOCAL_USER_QUOTA_BYTES:-}
      # Leave empty to auto-generate and persist in /data/jwt_secret.
      - DROPDRAWER_JWT_SECRET=${DROPDRAWER_JWT_SECRET:-}
      # Set to true after creating an admin account to enable /admin.
      - DROPDRAWER_ADMIN_ENABLED=${DROPDRAWER_ADMIN_ENABLED:-}
      # Legacy enable flag kept for upgrades from older templates (used only when
      # DROPDRAWER_ADMIN_ENABLED is unset). Its value no longer authenticates requests.
      - DROPDRAWER_ADMIN_TOKEN=${DROPDRAWER_ADMIN_TOKEN:-}
      # Set to true when deployed behind Nginx / Caddy / Cloudflare reverse proxy.
      - DROPDRAWER_TRUST_PROXY=${DROPDRAWER_TRUST_PROXY:-false}
      - DROPDRAWER_ALLOW_REGISTRATION=${DROPDRAWER_ALLOW_REGISTRATION:-true}
      - DROPDRAWER_TTL_CLEANUP_SECS=${DROPDRAWER_TTL_CLEANUP_SECS:-300}
      - DROPDRAWER_CORS_ORIGINS=${DROPDRAWER_CORS_ORIGINS:-}
      - RUST_LOG=${RUST_LOG:-info}
      # Google sign-in. Used until settings are saved once in /admin, which then wins.
      - DROPDRAWER_GOOGLE_CLIENT_ID=${DROPDRAWER_GOOGLE_CLIENT_ID:-}
      - DROPDRAWER_GOOGLE_CLIENT_SECRET=${DROPDRAWER_GOOGLE_CLIENT_SECRET:-}
      - DROPDRAWER_GOOGLE_REDIRECT_URI=${DROPDRAWER_GOOGLE_REDIRECT_URI:-}
      # Optional initial SMTP defaults (can also be configured live inside /admin).
      - DROPDRAWER_SMTP_HOST=${DROPDRAWER_SMTP_HOST:-}
      - DROPDRAWER_SMTP_PORT=${DROPDRAWER_SMTP_PORT:-587}
      - DROPDRAWER_SMTP_SECURITY=${DROPDRAWER_SMTP_SECURITY:-start_tls}
      - DROPDRAWER_SMTP_USERNAME=${DROPDRAWER_SMTP_USERNAME:-}
      - DROPDRAWER_SMTP_PASSWORD=${DROPDRAWER_SMTP_PASSWORD:-}
      - DROPDRAWER_SMTP_FROM=${DROPDRAWER_SMTP_FROM:-}
      - DROPDRAWER_SMTP_FROM_NAME=${DROPDRAWER_SMTP_FROM_NAME:-DropDrawer}
    volumes:
      - ./data/server:/data
